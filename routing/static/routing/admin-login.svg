<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice">
  <title>A truck on a desert highway at dusk, with a fuel route above</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f35"/>
      <stop offset="0.35" stop-color="#3b1f7a"/>
      <stop offset="0.62" stop-color="#8b3fa8"/>
      <stop offset="0.80" stop-color="#e86a8a"/>
      <stop offset="1" stop-color="#f9a65a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1748"/>
      <stop offset="1" stop-color="#0d0920"/>
    </linearGradient>
    <linearGradient id="trailer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1fb"/>
      <stop offset="1" stop-color="#c9c2df"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6d5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6d5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1000" height="900" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="90" cy="120" r="2.2" opacity="0.8"/>
    <circle cx="260" cy="70" r="1.6" opacity="0.6"/>
    <circle cx="410" cy="160" r="2" opacity="0.7"/>
    <circle cx="560" cy="60" r="1.4" opacity="0.5"/>
    <circle cx="720" cy="130" r="2.4" opacity="0.8"/>
    <circle cx="880" cy="80" r="1.6" opacity="0.6"/>
    <circle cx="950" cy="210" r="1.8" opacity="0.6"/>
    <circle cx="160" cy="250" r="1.4" opacity="0.5"/>
    <circle cx="640" cy="230" r="1.6" opacity="0.5"/>
  </g>
  <circle cx="640" cy="790" r="210" fill="url(#sun)"/>
  <circle cx="640" cy="790" r="95" fill="#ffe7a8" opacity="0.9"/>

  <!-- Fuel route: dashed path with numbered stops, like the map page -->
  <g>
    <path d="M 70 520 C 220 420, 330 560, 470 470 S 760 330, 930 400"
          fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="2 16"/>
    <circle cx="70" cy="520" r="15" fill="#2b8a3e" stroke="#fff" stroke-width="4"/>
    <circle cx="930" cy="400" r="15" fill="#c92a2a" stroke="#fff" stroke-width="4"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">
      <circle cx="285" cy="497" r="20" fill="#e8590c" stroke="#fff" stroke-width="4"/>
      <text x="285" y="504">1</text>
      <circle cx="560" cy="418" r="20" fill="#e8590c" stroke="#fff" stroke-width="4"/>
      <text x="560" y="425">2</text>
      <circle cx="790" cy="358" r="20" fill="#e8590c" stroke="#fff" stroke-width="4"/>
      <text x="790" y="365">3</text>
    </g>
  </g>

  <!-- Mesas -->
  <path d="M0 760 L60 760 L85 700 L210 700 L240 760 L330 760 L360 735 L420 735 L440 760
           L760 760 L790 690 L900 690 L930 760 L1000 760 L1000 900 L0 900 Z"
        fill="#6a2f8f"/>
  <path d="M0 830 L120 830 L150 780 L300 780 L335 830 L620 830 L650 800 L720 800 L745 830
           L1000 830 L1000 900 L0 900 Z"
        fill="#3a1a63"/>

  <!-- Ground and highway -->
  <rect y="900" width="1000" height="500" fill="url(#ground)"/>
  <rect y="885" width="1000" height="22" fill="#24143f"/>
  <rect y="1035" width="1000" height="150" fill="#17122a"/>
  <rect y="1035" width="1000" height="5" fill="#f0e6ff" opacity="0.5"/>
  <rect y="1180" width="1000" height="5" fill="#f0e6ff" opacity="0.5"/>
  <g fill="#ffd166">
    <rect x="-20" y="1106" width="90" height="8" rx="4"/>
    <rect x="140" y="1106" width="90" height="8" rx="4"/>
    <rect x="300" y="1106" width="90" height="8" rx="4"/>
    <rect x="460" y="1106" width="90" height="8" rx="4"/>
    <rect x="620" y="1106" width="90" height="8" rx="4"/>
    <rect x="780" y="1106" width="90" height="8" rx="4"/>
    <rect x="940" y="1106" width="90" height="8" rx="4"/>
  </g>

  <!-- Fuel price sign -->
  <g>
    <rect x="852" y="760" width="14" height="285" fill="#1c1533"/>
    <rect x="768" y="690" width="176" height="128" rx="12" fill="#1c1533" stroke="#f0e6ff" stroke-opacity="0.35" stroke-width="3"/>
    <g fill="#ffd166">
      <rect x="788" y="712" width="26" height="36" rx="4"/>
      <rect x="792" y="718" width="18" height="11" rx="2" fill="#1c1533"/>
      <path d="M814 722 h8 v22 a4 4 0 0 0 8 0 v-18" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="886" y="738" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#cdbfff" text-anchor="middle" letter-spacing="2">DIESEL</text>
    <text x="856" y="800" font-family="Menlo, Courier New, monospace" font-size="42" font-weight="700" fill="#ffd166" text-anchor="middle">$2.86</text>
  </g>

  <!-- Headlight beam -->
  <path d="M760 1060 L1000 1010 L1000 1150 Z" fill="url(#beam)"/>

  <!-- Truck (heading right) -->
  <g>
    <ellipse cx="470" cy="1172" rx="330" ry="14" fill="#000" opacity="0.35"/>
    <!-- Trailer -->
    <rect x="150" y="905" width="420" height="190" rx="10" fill="url(#trailer)"/>
    <rect x="150" y="1060" width="420" height="10" fill="#a855f7"/>
    <g stroke="#b3a9cf" stroke-width="2" opacity="0.6">
      <line x1="220" y1="915" x2="220" y2="1055"/>
      <line x1="290" y1="915" x2="290" y2="1055"/>
      <line x1="360" y1="915" x2="360" y2="1055"/>
      <line x1="430" y1="915" x2="430" y2="1055"/>
      <line x1="500" y1="915" x2="500" y2="1055"/>
    </g>
    <text x="360" y="1005" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800"
          fill="#6d28d9" text-anchor="middle" letter-spacing="4">FUEL ROUTE</text>
    <rect x="150" y="1095" width="420" height="22" fill="#2a2440"/>
    <!-- Cab -->
    <rect x="585" y="958" width="18" height="140" fill="#2a2440"/>
    <path d="M600 1117 L600 950 Q600 930 620 930 L690 930 Q712 930 720 950 L748 1018
             L790 1028 Q808 1032 808 1050 L808 1117 Z" fill="url(#cab)"/>
    <path d="M688 948 L712 948 L736 1012 L688 1012 Z" fill="#c9e7ff" opacity="0.85"/>
    <rect x="612" y="948" width="62" height="64" rx="6" fill="#c9e7ff" opacity="0.85"/>
    <rect x="608" y="1028" width="196" height="8" fill="#ffffff" opacity="0.25"/>
    <rect x="590" y="890" width="10" height="70" rx="4" fill="#cfc6e6"/>
    <rect x="796" y="1050" width="14" height="22" rx="3" fill="#fff6d5"/>
    <rect x="770" y="1092" width="44" height="12" rx="4" fill="#cfc6e6"/>
    <!-- Wheels -->
    <g>
      <circle cx="215" cy="1130" r="33" fill="#141020"/>
      <circle cx="285" cy="1130" r="33" fill="#141020"/>
      <circle cx="640" cy="1130" r="33" fill="#141020"/>
      <circle cx="760" cy="1130" r="33" fill="#141020"/>
      <g fill="#bdb3d8">
        <circle cx="215" cy="1130" r="13"/>
        <circle cx="285" cy="1130" r="13"/>
        <circle cx="640" cy="1130" r="13"/>
        <circle cx="760" cy="1130" r="13"/>
      </g>
    </g>
  </g>

  <!-- Foreground -->
  <path d="M0 1260 Q250 1235 500 1255 T1000 1250 L1000 1400 L0 1400 Z" fill="#0a0718"/>
  <g fill="#1d1338">
    <path d="M90 1262 l10 -40 l6 22 l8 -30 l7 48 Z"/>
    <path d="M880 1255 l8 -34 l7 20 l9 -28 l6 42 Z"/>
  </g>
</svg>

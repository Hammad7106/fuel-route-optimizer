services:
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
